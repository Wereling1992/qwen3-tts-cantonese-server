services:
  qwen3-tts-cantonese:
    build: .
    image: wereling1992/qwen3-tts-cantonese:latest
    container_name: qwen3-tts-cantonese
    restart: unless-stopped
    ports:
      - "3430:3430"
    volumes:
      # Persist models so they are only downloaded once
      - qwen3-tts-models:/models
    environment:
      - API_KEY=${API_KEY:-changeme}
      - REQUIRE_API_KEY=1
      - SPEAKER=hk_voice_343
      - DEFAULT_SEED=20260905
      - N_THREADS=0
      - MAX_CHARS_PER_CHUNK=45
      - HOST=0.0.0.0
      - PORT=3430
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3430/health"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 300s

volumes:
  qwen3-tts-models:
